<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tri-Realm Idle</title>
  <meta name="description" content="An idle RPG across three collided anime-inspired worlds: ninjas, soul reapers and pirates. Plays in your browser on desktop and mobile.">
  <meta name="theme-color" content="#05060d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tri-Realm">
  <meta property="og:title" content="Tri-Realm Idle">
  <meta property="og:description" content="Ninjas, soul reapers and pirates in one idle RPG. Play free in your browser.">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/seas.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>
  <header id="hud"></header>
  <nav id="rail"></nav>
  <main id="main"></main>
  <nav id="tabbar"></nav>
  <div id="scrim"></div>

  <div id="feed"></div>
  <div id="fx"></div>
  <div id="toasts"></div>
  <div id="coach" class="coach" role="status"></div>
  <div id="modal" class="modal"><div class="modal-card"><div id="modal-body"></div><button id="modal-close" class="gbtn">Continue</button></div></div>

  <script src="js/data.js"></script>
  <script src="js/worlds.js"></script>
  <script src="js/loot.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/game.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/quality.js"></script>
  <script src="js/seas.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/seas-ui.js"></script>
  <script src="js/dev.js"></script>
  <script src="js/ui-systems.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
