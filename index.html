    /* Pre-alpha: every JS error is kept (js/beta.js puts them in the bug report). */
    window.BETA_ERRORS = [];
    window.addEventListener('error', function (e) { if (e.target && e.target !== window && !/^(SCRIPT|LINK)$/.test(e.target.tagName)) return; if (BETA_ERRORS.length < 30) BETA_ERRORS.push({ t: Date.now(), m: String(e.message || (e.target && e.target.src ? 'Failed to load ' + e.target.src : 'error')), at: (e.filename || '').split('/').pop() + ':' + (e.lineno || 0), st: e.error && e.error.stack ? String(e.error.stack).slice(0, 600) : '' }); if (window.betaOnError) betaOnError(); }, true);
    window.addEventListener('unhandledrejection', function (e) { if (BETA_ERRORS.length < 30) BETA_ERRORS.push({ t: Date.now(), m: 'Promise: ' + String(e.reason && e.reason.message || e.reason), at: '', st: e.reason && e.reason.stack ? String(e.reason.stack).slice(0, 600) : '' }); if (window.betaOnError) betaOnError(); });
